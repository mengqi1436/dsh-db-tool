name: Publish to npm

# ─── trusted publisher 绑定约束：改动这里会直接让发布认证失败 ───
# npm 侧绑定（npmjs.com/package/dsh-db-tool/access）记录的是：
#   repository        = mengqi1436/dsh-db-tool
#   workflow filename = publish.yml   ← 本文件名不可改，也不可挪进子目录
#   environment name  = （空）        ← 不能给 job 加 environment:，subject 会不匹配
# 另有三条硬约束：
#   1) 不要改成被 workflow_call 复用——校验的是调用方 workflow 名，不是含 npm publish 的那个
#   2) 只支持云端 runner；换成 self-hosted 即失效
#   3) 发布 job 必须保留 id-token: write，否则换不到 OIDC token
# 绑定本身没有有效期：首次发布成功即验证完成并长期有效，不会像 granular token 那样到期。
# ──────────────────────────────────────────────────────────

on:
  push:
    branches: [master]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write # 打 git tag
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 不传 registry-url：旧版 setup-node 会写出 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
      # 空凭证会被优先于 OIDC 使用，trusted publisher 直接失效。
      # 用 Node 24 而非 22：Node 22 自带 npm 10.x，不满足 trusted publishing 的 npm >= 11.5.1。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 前置断言：npm 低于 11.5.1 时 OIDC 换不到凭证，报错会伪装成
      # 「Access token expired or revoked」，这里提前给出准确原因。
      - name: Assert npm supports OIDC
        run: |
          V=$(npm --version)
          echo "npm $V"
          node -e "const [a,b]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&b>=5)?0:1)" "$V" \
            || { echo "::error::npm $V 低于 11.5.1，trusted publishing 不可用"; exit 1; }

      - name: Check version changed
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          REG=$(npm view dsh-db-tool version 2>/dev/null || echo "none")
          if [ "$PKG" = "$REG" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged ($PKG), skip publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version changed: registry=$REG local=$PKG"
            echo "version=$PKG" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.ver.outputs.publish == 'true'
        run: npm install

      - name: Build
        if: steps.ver.outputs.publish == 'true'
        run: npm run build

      - name: Test
        if: steps.ver.outputs.publish == 'true'
        run: npm test

      - name: Publish
        if: steps.ver.outputs.publish == 'true'
        # 不注入 NODE_AUTH_TOKEN：由 npm trusted publisher（OIDC）授权。
        # 注入 token 会让认证回退到长期凭证，OIDC 形同虚设。
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --access public --provenance

      - name: Tag release
        if: steps.ver.outputs.publish == 'true'
        run: |
          V="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "tag v$V already exists on remote, skip tagging"
            exit 0
          fi
          git tag -a "v$V" -m "dsh-db-tool v$V"
          git push origin "v$V"
