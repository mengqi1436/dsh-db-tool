name: Publish to npm

on:
  push:
    branches: [master]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write # 打 git tag
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不传 registry-url：setup-node 会写出 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}，
      # 空凭证会被优先于 OIDC 使用，trusted publisher 直接失效。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # trusted publishing 要求 npm >= 11.5.1（Node 22 自带 npm 10 不支持 OIDC）
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@^11.5.1

      - name: Check version changed
        id: ver
        run: |
          PKG=$(node -p "require('./package.json').version")
          REG=$(npm view dsh-db-tool version 2>/dev/null || echo "none")
          if [ "$PKG" = "$REG" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged ($PKG), skip publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version changed: registry=$REG local=$PKG"
            echo "version=$PKG" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.ver.outputs.publish == 'true'
        run: npm install

      - name: Build
        if: steps.ver.outputs.publish == 'true'
        run: npm run build

      - name: Test
        if: steps.ver.outputs.publish == 'true'
        run: npm test

      - name: Publish
        if: steps.ver.outputs.publish == 'true'
        # 不注入 NODE_AUTH_TOKEN：由 npm trusted publisher（OIDC）授权。
        # 注入 token 会让认证回退到长期凭证，OIDC 形同虚设。
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --access public --provenance

      - name: Tag release
        if: steps.ver.outputs.publish == 'true'
        run: |
          V="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "tag v$V already exists on remote, skip tagging"
            exit 0
          fi
          git tag -a "v$V" -m "dsh-db-tool v$V"
          git push origin "v$V"
